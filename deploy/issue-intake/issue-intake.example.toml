# Inactive example. Copy to an owner-controlled absolute host path, set
# enabled = true only after owner approval, and keep both credential files
# private to that host.
[issue_intake]
enabled = false
state_root = "/var/lib/aflow/issue-intake"
private_api_url = "https://aflow-private.example"
private_credential_file = "/etc/aflow/issue-intake/private-api.token"
# github_api_url defaults to https://api.github.com when omitted.
github_credential_file = "/etc/aflow/issue-intake/github.token"
deferred_labels = ["deferred"]
workflow = "REPLACE_WITH_EXISTING_WORKFLOW"
team = "REPLACE_WITH_EXISTING_TEAM"
# start_step = "REPLACE_WITH_EXISTING_STEP"
# max_turns = 12

[[issue_intake.repositories]]
repository_id = 123456789 # Replace with an approved positive GitHub repository ID.
full_name = "OWNER/REPOSITORY"
project_id = "REPLACE_WITH_REGISTERED_PROJECT_ID"
