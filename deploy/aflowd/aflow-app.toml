# Rendered into the selected immutable release by install.sh. This file never
# contains bearer material; aflowd.env is a separate mode-0600 EnvironmentFile.
[server]
bind_host = "127.0.0.1"
bind_port = 8765

[control_plane]
managed_projects_root = "@MANAGED_PROJECTS_ROOT@"
project_registry_path = "@PROJECT_REGISTRY_PATH@"
aflow_executable = "@RELEASE_DIR@/bin/aflow"
environment_file = "@ENVIRONMENT_FILE@"
release_identity = "@RELEASE_ID@"
environment = { HOME = "/root", PATH = "@RELEASE_DIR@/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" }
