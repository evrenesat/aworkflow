# Copy only the configuration shape into ~/.codex/config.toml on the Mac.
# Export AFLOW_CONTROL_PLANE_TOKEN through the OS secret store or launch
# environment. Literal bearer tokens, query parameters, fragments, and userinfo
# in this URL are rejected by validate-mcp-config.py.
[mcp_servers.aflow_control_plane]
url = "http://100.103.69.9:8765/mcp"
required = false
bearer_token_env_var = "AFLOW_CONTROL_PLANE_TOKEN"
default_tools_approval_mode = "writes"

[mcp_servers.aflow_control_plane.tools.start_run]
approval_mode = "approve"

[mcp_servers.aflow_control_plane.tools.answer_startup]
approval_mode = "approve"

[mcp_servers.aflow_control_plane.tools.control_run]
approval_mode = "approve"

[mcp_servers.aflow_control_plane.tools.owner_stop]
approval_mode = "approve"

[mcp_servers.aflow_control_plane.tools.resume_run]
approval_mode = "approve"
