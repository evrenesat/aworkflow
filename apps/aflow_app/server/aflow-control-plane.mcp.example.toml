# Start `aflow ui` or `aflow ui --daemon` first. This is the UI server's
# authenticated HTTP MCP mount; use the configured token only through the
# environment-backed bearer-token setting below.
# Copy these entries into the Codex client's config.toml. Set
# AFLOW_CONTROL_PLANE_TOKEN through the operating system's secret storage or
# another non-repository environment source before starting Codex.
[mcp_servers.aflow_control_plane]
url = "http://127.0.0.1:8765/mcp"
required = false
bearer_token_env_var = "AFLOW_CONTROL_PLANE_TOKEN"
default_tools_approval_mode = "writes"

[mcp_servers.aflow_control_plane.tools.start_run]
approval_mode = "approve"

[mcp_servers.aflow_control_plane.tools.answer_startup]
approval_mode = "approve"

[mcp_servers.aflow_control_plane.tools.control_run]
approval_mode = "approve"

[mcp_servers.aflow_control_plane.tools.owner_stop]
approval_mode = "approve"

[mcp_servers.aflow_control_plane.tools.resume_run]
approval_mode = "approve"
