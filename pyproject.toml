[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aworkflow"
version = "0.1.12"
description = "Self-contained plan checkpoint controller for claude, codex, copilot, gemini, kiro, opencode, and pi"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "fastmcp>=3.2.0,<4.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff==0.16.5",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F841"]

[project.scripts]
aflow = "aflow.cli:main"
aworkflow = "aflow.cli:main"
aflowd = "aflow.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["aflow"]
