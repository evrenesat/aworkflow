[build-system]
requires = ["hatchling", "pyyaml>=6.0.0"]
build-backend = "hatchling.build"

[project]
name = "aworkflow"
version = "0.1.12"
description = "Plan checkpoint controller for Claude, Codex, Copilot, Gemini, Kiro, OpenCode, Pi, and Reasonix"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=3.2.0,<4.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.2.0",
    "pydantic>=2.0.0",
    "tomlkit>=0.13.0",
    "pyyaml>=6.0.0",
]

[project.urls]
Repository = "https://github.com/evrenesat/aworkflow"
Documentation = "https://github.com/evrenesat/aworkflow#readme"
Issues = "https://github.com/evrenesat/aworkflow/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff==0.16.5",
    "playwright>=1.49.0",
]

[tool.ruff]
target-version = "py311"
extend-exclude = ["tests"]

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F841"]

[project.scripts]
aflow = "aflow.cli:main"
aworkflow = "aflow.cli:main"
aflowd = "aflow.daemon:main"

[tool.hatch.build.targets.wheel]
packages = ["aflow", "apps/aflow_app/server/src/aflow_app_server"]

[tool.hatch.build.targets.sdist]
only-include = [
    "aflow",
    "apps/aflow_app/server/src/aflow_app_server",
    "apps/aflow_app/web/src",
    "apps/aflow_app/web/index.html",
    "apps/aflow_app/web/package.json",
    "apps/aflow_app/web/package-lock.json",
    "apps/aflow_app/web/tsconfig.json",
    "apps/aflow_app/web/tsconfig.node.json",
    "apps/aflow_app/web/tsconfig.test.json",
    "apps/aflow_app/web/vite.config.ts",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
