name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Provide p100 deployment test address
        if: runner.os == 'Linux'
        run: sudo ip address add 100.103.69.9/32 dev lo

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check production Python hygiene
        run: uv run ruff check aflow apps/aflow_app/server/src

      - name: Run tests
        run: uv run pytest -q

      - name: Compile Python sources
        run: uv run python -m compileall -q aflow apps/aflow_app/server/src

  dashboard:
    name: Dashboard (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # The dashboard server requires Python >=3.12; pin uv to the declared job
    # interpreter so its environment cannot silently use another installed minor.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.12"
          - "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/aflow_app/web/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install server dependencies
        working-directory: apps/aflow_app/server
        run: uv sync --frozen --group dev

      - name: Assert Dashboard Python matches matrix
        working-directory: apps/aflow_app/server
        run: |
          uv run python -c 'import os, sys; expected = os.environ["UV_PYTHON"]; actual = f"{sys.version_info.major}.{sys.version_info.minor}"; assert actual == expected, f"Dashboard matrix {expected} selected Python {actual} ({sys.executable})"; print(f"Dashboard interpreter: Python {actual} ({sys.executable})")'

      - name: Install web dependencies
        working-directory: apps/aflow_app/web
        run: npm ci

      - name: Run web tests
        working-directory: apps/aflow_app/web
        run: npm test -- --run

      - name: Build web app
        working-directory: apps/aflow_app/web
        run: npm run build

      - name: Run server tests
        working-directory: apps/aflow_app/server
        run: |
          uv run playwright install --with-deps chromium
          uv run pytest -q

      - name: Install WebKit and run responsive browser checks
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        working-directory: apps/aflow_app/server
        env:
          AFLOW_TEST_BROWSER: webkit
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/responsive-browser"
          uv run playwright install --with-deps webkit
          uv run pytest -q tests/test_responsive_browser.py --basetemp="$GITHUB_WORKSPACE/artifacts/responsive-browser"

      - name: Upload responsive browser artifacts
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: responsive-browser-${{ github.run_id }}
          path: artifacts/responsive-browser
          if-no-files-found: warn


  packaging:
    name: Packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node (build-time only; the released wheel never needs it)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/aflow_app/web/package-lock.json

      - name: Build wheel from the checkout
        run: uv build --wheel

      - name: Verify wheel bundles the UI assets and server package
        run: python scripts/smoke_ui.py --verify-wheel dist/aworkflow-*.whl

      - name: Build wheel from the sdist
        run: |
          uv build --sdist --out-dir dist-sdist
          uv build --wheel dist-sdist/aworkflow-*.tar.gz --out-dir dist-from-sdist
          python scripts/smoke_ui.py --verify-wheel dist-from-sdist/aworkflow-*.whl

      - name: Installed-wheel smoke without Node (wheel from checkout)
        run: python scripts/smoke_ui.py --wheel dist/aworkflow-*.whl --login-only

      - name: Installed-wheel smoke without Node (wheel from sdist)
        run: python scripts/smoke_ui.py --wheel dist-from-sdist/aworkflow-*.whl --login-only

  browser-smoke:
    name: Browser smoke (Linux, full flow)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/aflow_app/web/package-lock.json

      - name: Build the distributable wheel
        run: uv build --wheel

      - name: Install Playwright Chromium
        run: |
          uv sync --frozen --group dev
          uv run --group dev playwright install chromium

      - name: Browser smoke over non-loopback HTTP (installed wheel)
        run: |
          python scripts/smoke_ui.py \
            --wheel dist/aworkflow-*.whl \
            --browser \
            --playwright-python "$(uv run --group dev python -c 'import sys; print(sys.executable)')"

  browser-smoke-macos:
    name: Browser smoke (macOS, login/cookie check)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/aflow_app/web/package-lock.json

      - name: Build the distributable wheel
        run: uv build --wheel

      - name: Install Playwright Chromium
        run: |
          uv sync --frozen --group dev
          uv run --group dev playwright install chromium

      - name: Minimal browser login/cookie check over non-loopback HTTP
        run: |
          python scripts/smoke_ui.py \
            --wheel dist/aworkflow-*.whl \
            --browser --login-only \
            --playwright-python "$(uv run --group dev python -c 'import sys; print(sys.executable)')"
