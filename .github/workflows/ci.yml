name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Provide p100 deployment test address
        if: runner.os == 'Linux'
        run: sudo ip address add 100.103.69.9/32 dev lo

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check production Python hygiene
        run: uv run ruff check aflow apps/aflow_app/server/src

      - name: Run tests
        run: uv run pytest -q

      - name: Compile Python sources
        run: uv run python -m compileall -q aflow apps/aflow_app/server/src

  dashboard:
    name: Dashboard (server, web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/aflow_app/web/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install server dependencies
        working-directory: apps/aflow_app/server
        run: uv sync --frozen --group dev

      - name: Run server tests
        working-directory: apps/aflow_app/server
        run: uv run pytest -q

      - name: Install web dependencies
        working-directory: apps/aflow_app/web
        run: npm ci

      - name: Run web tests
        working-directory: apps/aflow_app/web
        run: npm test -- --run

      - name: Build web app
        working-directory: apps/aflow_app/web
        run: npm run build

  build:
    name: Build package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build package
        run: uv build
